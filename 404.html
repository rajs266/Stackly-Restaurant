<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <link rel="icon" href="assets/top-logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="assets/top-logo.webp">
  <title>404 — Page Not Found | Stackly Restaurant</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(26,10,0,0.92), rgba(45,21,0,0.95)),
                  url('assets/images/photo-1517248135467-4c7edcad34c4.webp') center/cover fixed;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    /* Animated background particles */
    .error-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      font-size: 2rem;
      opacity: 0.06;
      animation: floatParticle linear infinite;
      user-select: none;
    }
    @keyframes floatParticle {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.06; }
      90% { opacity: 0.06; }
      100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
    }

    /* Glitch effect background lines */
    .glitch-lines {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .glitch-line {
      position: absolute;
      height: 2px;
      background: rgba(255,69,0,0.12);
      animation: glitchLine 3s ease-in-out infinite;
    }
    @keyframes glitchLine {
      0%,100% { transform: translateX(-100%); opacity: 0; }
      50% { transform: translateX(100vw); opacity: 1; }
    }

    /* Main content */
    .error-content {
      text-align: center;
      position: relative;
      z-index: 2;
      max-width: 650px;
      animation: fadeInUp 1s ease forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 404 Number with glitch effect */
    .error-num-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    .error-num {
      font-family: var(--font-display);
      font-size: clamp(7rem, 20vw, 14rem);
      color: var(--primary);
      line-height: 1;
      letter-spacing: 15px;
      text-shadow:
        3px 3px 0 var(--secondary),
        6px 6px 0 rgba(255,69,0,0.3),
        0 0 80px rgba(255,69,0,0.5);
      position: relative;
      animation: glitchText 3s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    @keyframes glitchText {
      0%,90%,100% {
        text-shadow: 3px 3px 0 var(--secondary), 6px 6px 0 rgba(255,69,0,0.3), 0 0 80px rgba(255,69,0,0.5);
        transform: translate(0);
      }
      92% {
        text-shadow: -3px 3px 0 var(--secondary), 6px -6px 0 rgba(255,69,0,0.3);
        transform: translate(2px, -2px);
      }
      94% {
        text-shadow: 3px -3px 0 var(--secondary), -6px 6px 0 rgba(255,69,0,0.3);
        transform: translate(-2px, 2px);
      }
      96% {
        text-shadow: -3px -3px 0 var(--secondary), -6px -6px 0 rgba(255,69,0,0.3);
        transform: translate(0);
      }
    }

    /* Error title */
    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: white;
      letter-spacing: 3px;
      margin: 15px 0;
      animation: fadeInUp 1s ease 0.3s forwards;
      opacity: 0;
    }

    /* Error message */
    .error-text {
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 25px;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
      animation: fadeInUp 1s ease 0.5s forwards;
      opacity: 0;
    }

    /* Fun message */
    .error-fun-msg {
      background: rgba(255,69,0,0.15);
      border: 1px solid rgba(255,69,0,0.3);
      border-radius: var(--radius);
      padding: 12px 20px;
      color: var(--secondary);
      font-family: var(--font-heading);
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 25px;
      animation: fadeInUp 1s ease 0.6s forwards, msgPulse 2s ease-in-out infinite 1.5s;
      opacity: 0;
    }
    @keyframes msgPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,69,0,0.3); }
      50% { box-shadow: 0 0 20px 5px rgba(255,69,0,0); }
    }

    /* Buttons - ONLY 2 */
    .error-btns {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 1s ease 0.7s forwards;
      opacity: 0;
    }
    .error-btns .btn {
      padding: 14px 32px;
      font-size: 1rem;
      min-width: 160px;
    }
    .error-btns .btn-primary {
      animation: btnGlow 2s ease-in-out infinite;
    }
    @keyframes btnGlow {
      0%,100% { box-shadow: 0 6px 20px rgba(255,69,0,0.4); }
      50% { box-shadow: 0 6px 30px rgba(255,69,0,0.6), 0 0 40px rgba(255,69,0,0.2); }
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 999;
      animation: confettiFall 3s ease-in forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .error-num {
        letter-spacing: 8px;
        gap: 5px;
      }
      .error-btns {
        flex-direction: column;
        align-items: center;
      }
      .error-btns .btn {
        width: 100%;
        max-width: 280px;
      }
    }

    @media (max-width: 380px) {
      .error-num {
        letter-spacing: 5px;
      }
    }
  </style>
</head>
<body class="error-page">

<!-- Animated Particles -->
<div class="error-particles" id="errorParticles"></div>

<!-- Glitch Lines -->
<div class="glitch-lines" id="glitchLines"></div>

<!-- Confetti Container -->
<div id="confettiContainer"></div>

<!-- Main Content -->
<div class="error-content">

  <!-- 404 Number with orbit and emoji inside 0 -->
  <div class="error-num-wrap">
    <div class="error-num">
      <span>4</span>
      <span>0</span>
      <span>4</span>
    </div>
  </div>

  <!-- Title -->
  <h1 class="error-title">Oops! Page Not Found</h1>

  <!-- Fun Message -->
  <div class="error-fun-msg" id="funMsg">🍕 Looks like this page got eaten!</div>

  <!-- Description -->
  <p class="error-text">
    The page you're looking for seems to have vanished into thin air... or maybe one of our hungry chefs mistook it for a recipe!
  </p>

  <!-- ONLY 2 BUTTONS -->
  <div class="error-btns">
    <a href="index.html" class="btn btn-primary btn-lg">🏠 Back To Home</a>
    <button onclick="history.back()" class="btn btn-outline btn-lg">← Go Back</button>
  </div>

</div>

<script>
// ── Generate Floating Particles ──
const foodEmojis = ['🍕','🍔','🌮','🍜','🥗','🍰','🧁','🥩','🍣','🥐','🍟','🥤','🍩','🍪','🍫','🍿','🥞','🍖'];
const particlesContainer = document.getElementById('errorParticles');

for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = foodEmojis[Math.floor(Math.random() * foodEmojis.length)];
  p.style.left = Math.random() * 100 + '%';
  p.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
  p.style.animationDuration = (8 + Math.random() * 15) + 's';
  p.style.animationDelay = (Math.random() * 10) + 's';
  particlesContainer.appendChild(p);
}

// ── Generate Glitch Lines ──
const glitchContainer = document.getElementById('glitchLines');
for (let i = 0; i < 5; i++) {
  const line = document.createElement('div');
  line.className = 'glitch-line';
  line.style.top = (15 + Math.random() * 70) + '%';
  line.style.width = (30 + Math.random() * 40) + '%';
  line.style.animationDelay = (Math.random() * 3) + 's';
  line.style.animationDuration = (2 + Math.random() * 3) + 's';
  glitchContainer.appendChild(line);
}

// ── Confetti Burst on Load ──
function confettiBurst() {
  const colors = ['#FF4500','#FFD700','#FF6B35','#00C9A7','#fff','#ff4444','#8A2BE2'];
  const container = document.getElementById('confettiContainer');

  for (let i = 0; i < 35; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const size = 6 + Math.random() * 10;
    c.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -20px;
      width: ${size}px;
      height: ${size}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      animation-delay: ${Math.random() * 2}s;
      animation-duration: ${2 + Math.random() * 3}s;
      transform: rotate(${Math.random() * 360}deg);
    `;
    container.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}
setTimeout(confettiBurst, 500);

// ── Rotating Fun Messages ──
const funMessages = [
  "🍕 Looks like this page got eaten!",
  "🍔 Our chef couldn't find this recipe!",
  "🍜 This dish is not on our menu!",
  "🍰 Someone took the last slice!",
  "🌮 This taco went missing!",
  "🥗 This salad got tossed away!",
  "🍩 The donut rolled away!",
  "🍪 Cookie crumbled into bits!"
];

let msgIndex = 0;
const msgEl = document.getElementById('funMsg');

setInterval(() => {
  msgIndex = (msgIndex + 1) % funMessages.length;
  msgEl.style.opacity = '0';
  setTimeout(() => {
    msgEl.textContent = funMessages[msgIndex];
    msgEl.style.opacity = '1';
  }, 300);
}, 4000);

</script>

</body>
</html>
